<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Sign In – LibraryLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 950: '#091322', 900: '#0f1e36', 800: '#172d4d', 700: '#1e3a5f' },
            teal: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 950: '#042f2e' },
            cream: '#fbf9f4'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body class="bg-[#fbf9f4] text-slate-800 antialiased flex flex-col min-h-screen">

  <div id="main-header"></div>

  <main class="flex-1 flex items-center justify-center py-16 px-4">
    <div class="w-full max-w-md">
      
      <!-- Card -->
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 px-8 pt-10 pb-8 text-center">
          <div class="w-16 h-16 bg-teal-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-teal-500/30">
            <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-extrabold text-white font-serif mb-1">Welcome Back</h1>
          <p class="text-sm text-slate-400">Sign in to your LibraryLink account</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-8">
          <div id="signin-error" class="hidden mb-5 p-4 bg-rose-50 border border-rose-200 rounded-xl text-sm text-rose-700 font-medium"></div>
          <div id="signin-success" class="hidden mb-5 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-sm text-emerald-700 font-medium"></div>

          <form id="signin-form" class="space-y-5" novalidate>
            
            <div>
              <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Email Address</label>
              <input 
                type="email" 
                id="email" 
                name="email"
                autocomplete="email"
                placeholder="your@email.com"
                class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
                required
              />
            </div>

            <div>
              <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="password" 
                  name="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all pr-12"
                  required
                />
                <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <button 
              type="submit" 
              id="signin-btn"
              class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl transition-colors text-sm shadow-sm flex items-center justify-center gap-2"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
              Sign In
            </button>
          </form>

          <div class="mt-6 text-center space-y-3">
            <p class="text-sm text-slate-500">
              Don't have an account? 
              <a href="/user-signup.html" class="text-teal-600 hover:text-teal-700 font-semibold">Create one here</a>
            </p>
            <div class="border-t border-slate-100 pt-4">
              <p class="text-xs text-slate-400">
                Admin staff? <a href="/admin.html" class="text-amber-600 hover:text-amber-700 font-medium">Admin Portal &rarr;</a>
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Demo credentials hint -->
      <div class="mt-6 p-4 bg-teal-50 border border-teal-200 rounded-2xl text-xs text-teal-800">
        <p class="font-semibold mb-1">Demo Account (for testing)</p>
        <p>Email: <code class="bg-teal-100 px-1 rounded">rohan.sharma@collegemail.edu</code></p>
        <p>Password: <code class="bg-teal-100 px-1 rounded">student123</code></p>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation('signin');

      // If already logged in, redirect to dashboard
      if (API.isUserLoggedIn()) {
        window.location.href = '/user-dashboard.html';
        return;
      }

      const form = document.getElementById('signin-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        await handleSignin();
      });
    });

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    async function handleSignin() {
      const btn = document.getElementById('signin-btn');
      const errorDiv = document.getElementById('signin-error');
      const successDiv = document.getElementById('signin-success');
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorDiv.textContent = 'Please enter your email address and password.';
        errorDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>Signing in...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.message || 'Sign in failed');
        }

        // Store user token and profile
        API.setUserToken(data.token);
        API.setCurrentUser(data.user);

        successDiv.textContent = `Welcome back, ${data.user.name}! Redirecting to your dashboard...`;
        successDiv.classList.remove('hidden');

        setTimeout(() => {
          // Check if there's a redirect URL stored (e.g. from book reservation)
          const redirectUrl = sessionStorage.getItem('librarylink_redirect_after_login');
          if (redirectUrl) {
            sessionStorage.removeItem('librarylink_redirect_after_login');
            window.location.href = redirectUrl;
          } else {
            window.location.href = '/user-dashboard.html';
          }
        }, 1000);
      } catch (err) {
        errorDiv.textContent = err.message || 'Invalid email or password. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>Sign In';
      }
    }
  </script>
</body>
</html>
