<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="280" height="400">
  <defs>
    <linearGradient id="grad-11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134E4A" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="280" height="400" rx="8" fill="url(#grad-11)" />

  <!-- Decorative Pattern Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="20" y1="20" x2="260" y2="20" />
    <line x1="20" y1="380" x2="260" y2="380" />
    <circle cx="140" cy="140" r="80" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="140" cy="140" r="50" fill="none" stroke="#2DD4BF" stroke-width="1.5" />
  </g>

  <!-- Book Spine Visual Simulation -->
  <rect x="0" y="0" width="14" height="400" rx="3" fill="url(#spine-grad)" />

  <!-- Category Badge -->
  <rect x="140" y="55" width="120" height="24" rx="12" transform="translate(-60, 0)" fill="#0D9488" opacity="0.9" />
  <text x="140" y="71" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SELF-HELP</text>

  <!-- Title Centerpiece -->
  <g transform="translate(0, 0)">
    <text x="140" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Deep Work</text>
  </g>

  <!-- Decorative Divider -->
  <line x1="90" y1="300" x2="190" y2="300" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" />

  <!-- Author Name -->
  <text x="140" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Cal Newport</text>

  <!-- Bottom Brand & ISBN Tag -->
  <text x="140" y="370" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">LibraryLink Verified • 978-1455586691</text>
</svg>