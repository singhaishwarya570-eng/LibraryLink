<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="48" height="48" rx="12" fill="url(#logo-grad)" filter="url(#logo-glow)" />
  
  <!-- Stylized Open Book & Connection Nodes -->
  <path d="M24 16c-3.5-2.5-8-2.5-12 0v17c4-2 8.5-2 12 0 3.5-2 8-2 12 0V16c-4-2.5-8.5-2.5-12 0z" 
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <line x1="24" y1="16" x2="24" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Connected Community Nodes -->
  <circle cx="12" cy="16" r="2.5" fill="#38bdf8" />
  <circle cx="24" cy="11" r="2.5" fill="#2dd4bf" />
  <circle cx="36" cy="16" r="2.5" fill="#38bdf8" />
  
  <!-- Subtle network linking arc -->
  <path d="M12 16 Q24 7 36 16" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 2" fill="none" opacity="0.8" />
</svg>
