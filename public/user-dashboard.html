<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard – LibraryLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 950: '#091322', 900: '#0f1e36', 800: '#172d4d', 700: '#1e3a5f' },
            teal: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 950: '#042f2e' },
            cream: '#fbf9f4'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body class="bg-[#fbf9f4] text-slate-800 antialiased flex flex-col min-h-screen">

  <div id="main-header"></div>

  <main class="flex-1 py-10 px-4">
    <div class="max-w-5xl mx-auto">

      <!-- Page heading -->
      <div id="dashboard-header" class="mb-8">
        <div class="animate-pulse bg-slate-200 h-8 w-64 rounded-xl mb-2"></div>
        <div class="animate-pulse bg-slate-200 h-4 w-48 rounded-xl"></div>
      </div>

      <!-- Stats Row -->
      <div id="stats-row" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

      <!-- Two-column layout -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left: Profile Card -->
        <div class="lg:col-span-1">
          <div id="profile-card" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 h-fit">
            <div class="animate-pulse space-y-3">
              <div class="w-16 h-16 bg-slate-200 rounded-full mx-auto"></div>
              <div class="bg-slate-200 h-5 w-32 rounded mx-auto"></div>
              <div class="bg-slate-200 h-3 w-40 rounded mx-auto"></div>
            </div>
          </div>

          <!-- Reading Challenge card -->
          <div id="challenge-card" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 mt-6"></div>
        </div>

        <!-- Right: Reservations -->
        <div class="lg:col-span-2">
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
              <h2 class="font-bold text-slate-900">My Reservations</h2>
              <a href="/books.html" class="text-xs font-semibold text-teal-600 hover:text-teal-700">+ Reserve a Book</a>
            </div>
            <div id="reservations-list" class="divide-y divide-slate-100">
              <div class="p-6 text-center text-slate-400 text-sm animate-pulse">Loading your reservations...</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Guard: must be logged in
      if (!API.isUserLoggedIn()) {
        sessionStorage.setItem('librarylink_redirect_after_login', '/user-dashboard.html');
        window.location.href = '/user-signin.html';
        return;
      }

      initNavigation('dashboard');
      await loadDashboard();
    });

    async function loadDashboard() {
      try {
        // Fetch fresh profile from server
        const profileRes = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${API.getUserToken()}` }
        });
        const profileData = await profileRes.json();
        if (!profileData.success) throw new Error(profileData.message);
        const user = profileData.user;
        API.setCurrentUser(user); // keep local copy fresh

        // Fetch reservations
        const resRes = await fetch('/api/auth/my-reservations', {
          headers: { 'Authorization': `Bearer ${API.getUserToken()}` }
        });
        const resData = await resRes.json();
        const reservations = resData.data || [];

        // Fetch reading progress
        let readingProgress = null;
        try {
          const rpRes = await fetch(`/api/reading-progress?email=${encodeURIComponent(user.email)}`);
          const rpData = await rpRes.json();
          readingProgress = rpData.data || null;
        } catch (e) { /* silent */ }

        renderHeader(user);
        renderStats(user, reservations);
        renderProfileCard(user);
        renderReadingChallenge(readingProgress);
        renderReservations(reservations);

      } catch (err) {
        console.error('Dashboard load error:', err);
        // If token expired, log out
        if (err.message && (err.message.includes('expired') || err.message.includes('token') || err.message.includes('authorized'))) {
          API.logoutUser();
          window.location.href = '/user-signin.html';
        }
      }
    }

    function renderHeader(user) {
      const container = document.getElementById('dashboard-header');
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      container.innerHTML = `
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 font-serif">${greeting}, ${user.name.split(' ')[0]}! 👋</h1>
        <p class="text-sm text-slate-500 mt-1">Welcome to your personal LibraryLink dashboard.</p>
      `;
    }

    function renderStats(user, reservations) {
      const container = document.getElementById('stats-row');
      const active = reservations.filter(r => ['Pending','Confirmed','Ready for Pickup','Out for Delivery'].includes(r.status)).length;
      const completed = reservations.filter(r => r.status === 'Completed').length;
      const cancelled = reservations.filter(r => r.status === 'Cancelled').length;

      container.innerHTML = [
        { label: 'Total Reservations', value: reservations.length, color: 'text-teal-700', bg: 'bg-teal-50', border: 'border-teal-100' },
        { label: 'Active', value: active, color: 'text-amber-700', bg: 'bg-amber-50', border: 'border-amber-100' },
        { label: 'Completed', value: completed, color: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-100' },
        { label: 'Cancelled', value: cancelled, color: 'text-slate-600', bg: 'bg-slate-50', border: 'border-slate-100' },
      ].map(s => `
        <div class="${s.bg} border ${s.border} rounded-2xl p-5 text-center">
          <p class="text-3xl font-extrabold font-serif ${s.color}">${s.value}</p>
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-1">${s.label}</p>
        </div>
      `).join('');
    }

    function renderProfileCard(user) {
      const container = document.getElementById('profile-card');
      const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      const memberSince = new Date(user.createdAt).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
      container.innerHTML = `
        <div class="text-center mb-5">
          <div class="w-16 h-16 bg-teal-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
            <span class="text-xl font-extrabold text-white">${initials}</span>
          </div>
          <h3 class="font-bold text-slate-900 text-lg">${user.name}</h3>
          <p class="text-xs text-slate-500 mt-0.5">${user.email}</p>
        </div>
        <div class="space-y-3 text-sm border-t border-slate-100 pt-4">
          ${user.phone ? `
            <div class="flex items-center gap-2 text-slate-600">
              <svg class="w-4 h-4 text-teal-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              <span>${user.phone}</span>
            </div>
          ` : ''}
          ${user.address ? `
            <div class="flex items-start gap-2 text-slate-600">
              <svg class="w-4 h-4 text-teal-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>${user.address}</span>
            </div>
          ` : ''}
          <div class="flex items-center gap-2 text-slate-500 text-xs pt-2 border-t border-slate-100">
            <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>Member since ${memberSince}</span>
          </div>
        </div>
        <div class="mt-5 pt-4 border-t border-slate-100">
          <button onclick="handleUserLogout()" class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-rose-600 border border-rose-200 hover:bg-rose-50 transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Sign Out
          </button>
        </div>
      `;
    }

    function renderReadingChallenge(progress) {
      const container = document.getElementById('challenge-card');
      if (!progress) {
        container.innerHTML = `
          <h3 class="font-bold text-slate-900 mb-3 text-sm">Reading Challenge</h3>
          <p class="text-xs text-slate-500 mb-4">Track your reading progress for 2026.</p>
          <a href="/challenge.html" class="block w-full py-2.5 text-center rounded-xl text-xs font-semibold bg-teal-600 hover:bg-teal-500 text-white transition-colors">
            Join Reading Challenge
          </a>
        `;
        return;
      }
      const pct = Math.min(100, Math.round((progress.booksCompleted / (progress.yearlyGoal || 1)) * 100));
      container.innerHTML = `
        <h3 class="font-bold text-slate-900 mb-4 text-sm">📚 Reading Challenge 2026</h3>
        <div class="mb-3">
          <div class="flex justify-between text-xs text-slate-600 mb-1">
            <span>${progress.booksCompleted} books completed</span>
            <span>Goal: ${progress.yearlyGoal}</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-teal-500 rounded-full transition-all" style="width: ${pct}%"></div>
          </div>
          <p class="text-xs text-teal-700 font-semibold mt-1">${pct}% complete</p>
        </div>
        <div class="grid grid-cols-2 gap-2 text-center text-xs mt-3">
          <div class="bg-slate-50 rounded-xl p-2 border border-slate-100">
            <p class="font-bold text-slate-900 text-base">${progress.currentStreakDays || 0}</p>
            <p class="text-slate-500">Day streak</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-2 border border-slate-100">
            <p class="font-bold text-slate-900 text-base">${Math.round((progress.totalReadingMinutes || 0) / 60)}h</p>
            <p class="text-slate-500">Reading time</p>
          </div>
        </div>
        <a href="/challenge.html" class="block w-full py-2 text-center rounded-xl text-xs font-semibold text-teal-700 hover:text-teal-800 border border-teal-200 hover:bg-teal-50 transition-colors mt-4">
          View Full Challenge
        </a>
      `;
    }

    const STATUS_STYLES = {
      'Pending': 'bg-amber-100 text-amber-800',
      'Confirmed': 'bg-blue-100 text-blue-800',
      'Ready for Pickup': 'bg-teal-100 text-teal-800',
      'Out for Delivery': 'bg-indigo-100 text-indigo-800',
      'Completed': 'bg-emerald-100 text-emerald-800',
      'Cancelled': 'bg-slate-100 text-slate-500'
    };

    function renderReservations(reservations) {
      const container = document.getElementById('reservations-list');
      if (!reservations.length) {
        container.innerHTML = `
          <div class="p-10 text-center">
            <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-7 h-7 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            </div>
            <p class="text-slate-500 font-medium mb-2">No reservations yet</p>
            <p class="text-xs text-slate-400 mb-5">Browse our catalogue and reserve your first book.</p>
            <a href="/books.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold rounded-xl transition-colors">
              Browse Books
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = reservations.map(r => {
        const reservedDate = new Date(r.reservedAt || r.createdAt).toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
        const statusClass = STATUS_STYLES[r.status] || 'bg-slate-100 text-slate-600';
        const bookTitle = r.book?.title || r.bookTitle || 'Unknown Book';
        const bookAuthor = r.book?.author || '';
        const coverImage = r.book?.coverImage || '';
        const libraryName = r.library?.name || r.libraryName || 'Unknown Library';
        const isActive = ['Pending','Confirmed','Ready for Pickup','Out for Delivery'].includes(r.status);

        return `
          <div class="p-4 sm:p-6 hover:bg-slate-50 transition-colors">
            <div class="flex gap-4">
              ${coverImage ? `
                <div class="flex-shrink-0 w-14 h-20 rounded-lg overflow-hidden bg-slate-100 border border-slate-200 shadow-sm">
                  <img src="${coverImage}" alt="${bookTitle}" class="w-full h-full object-contain p-1" onerror="this.style.display='none'"/>
                </div>
              ` : `
                <div class="flex-shrink-0 w-14 h-20 rounded-lg bg-teal-50 border border-teal-100 flex items-center justify-center">
                  <svg class="w-6 h-6 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
              `}
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2 flex-wrap">
                  <div>
                    <h3 class="font-bold text-slate-900 text-sm leading-tight truncate">${bookTitle}</h3>
                    ${bookAuthor ? `<p class="text-xs text-slate-500 mt-0.5">by ${bookAuthor}</p>` : ''}
                  </div>
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold flex-shrink-0 ${statusClass}">${r.status}</span>
                </div>
                <div class="mt-2 space-y-1 text-xs text-slate-600">
                  <div class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    <span>${libraryName}</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span>Reserved ${reservedDate}</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                    <span>${r.fulfillmentType === 'pickup' ? 'Free Self-Pickup' : 'Home Delivery'}</span>
                    ${r.deliveryFee > 0 ? `<span class="text-teal-700 font-medium">• ₹${r.deliveryFee}</span>` : ''}
                  </div>
                  <p class="font-mono text-slate-400 text-[11px]">${r.reservationNumber}</p>
                </div>
                ${isActive ? `
                  <div class="mt-3">
                    <button 
                      onclick="cancelReservation('${r._id}', this)" 
                      class="text-xs font-semibold text-rose-500 hover:text-rose-700 border border-rose-200 hover:bg-rose-50 px-3 py-1 rounded-lg transition-colors"
                    >
                      Cancel Reservation
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelReservation(id, btn) {
      if (!confirm('Are you sure you want to cancel this reservation?')) return;
      btn.disabled = true;
      btn.textContent = 'Cancelling...';
      try {
        const res = await fetch(`/api/auth/my-reservations/${id}/cancel`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${API.getUserToken()}` }
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        showToast('Reservation cancelled successfully.', 'success');
        await loadDashboard();
      } catch (err) {
        showToast(err.message || 'Failed to cancel reservation.', 'error');
        btn.disabled = false;
        btn.textContent = 'Cancel Reservation';
      }
    }
  </script>
</body>
</html>
