<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – LibraryLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 950: '#091322', 900: '#0f1e36', 800: '#172d4d', 700: '#1e3a5f' },
            teal: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 950: '#042f2e' },
            cream: '#fbf9f4'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body class="bg-[#fbf9f4] text-slate-800 antialiased flex flex-col min-h-screen">

  <div id="main-header"></div>

  <main class="flex-1 flex items-center justify-center py-16 px-4">
    <div class="w-full max-w-md">
      
      <!-- Card -->
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 px-8 pt-10 pb-8 text-center">
          <div class="w-16 h-16 bg-teal-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-teal-500/30">
            <svg class="w-8 h-8 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-extrabold text-white font-serif mb-1">Create Account</h1>
          <p class="text-sm text-slate-400">Join LibraryLink – open to everyone</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-8">
          <div id="signup-error" class="hidden mb-5 p-4 bg-rose-50 border border-rose-200 rounded-xl text-sm text-rose-700 font-medium"></div>
          <div id="signup-success" class="hidden mb-5 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-sm text-emerald-700 font-medium"></div>

          <form id="signup-form" class="space-y-5" novalidate>
            
            <div>
              <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Full Name <span class="text-rose-500">*</span></label>
              <input 
                type="text" 
                id="name" 
                name="name"
                autocomplete="name"
                placeholder="e.g. Priya Mehta"
                class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
                required
              />
            </div>

            <div>
              <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Email Address <span class="text-rose-500">*</span></label>
              <input 
                type="email" 
                id="email" 
                name="email"
                autocomplete="email"
                placeholder="your@email.com"
                class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
                required
              />
              <p class="text-xs text-slate-400 mt-1">Any valid email address – no domain restrictions.</p>
            </div>

            <div>
              <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password <span class="text-rose-500">*</span></label>
              <div class="relative">
                <input 
                  type="password" 
                  id="password" 
                  name="password"
                  autocomplete="new-password"
                  placeholder="Minimum 6 characters"
                  class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all pr-12"
                  required
                />
                <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
              <!-- Password strength indicator -->
              <div id="password-strength" class="mt-2 hidden">
                <div class="flex gap-1 mb-1">
                  <div id="str-1" class="h-1 flex-1 rounded-full bg-slate-200"></div>
                  <div id="str-2" class="h-1 flex-1 rounded-full bg-slate-200"></div>
                  <div id="str-3" class="h-1 flex-1 rounded-full bg-slate-200"></div>
                  <div id="str-4" class="h-1 flex-1 rounded-full bg-slate-200"></div>
                </div>
                <p id="strength-label" class="text-xs text-slate-500"></p>
              </div>
            </div>

            <div>
              <label for="confirm-password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Confirm Password <span class="text-rose-500">*</span></label>
              <div class="relative">
                <input 
                  type="password" 
                  id="confirm-password" 
                  name="confirmPassword"
                  autocomplete="new-password"
                  placeholder="Repeat your password"
                  class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all pr-12"
                  required
                />
                <button type="button" onclick="togglePassword('confirm-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
              <p id="password-match" class="text-xs mt-1 hidden"></p>
            </div>

            <button 
              type="submit" 
              id="signup-btn"
              class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl transition-colors text-sm shadow-sm flex items-center justify-center gap-2"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
              Create Account
            </button>
          </form>

          <div class="mt-6 text-center space-y-3">
            <p class="text-sm text-slate-500">
              Already have an account? 
              <a href="/user-signin.html" class="text-teal-600 hover:text-teal-700 font-semibold">Sign in here</a>
            </p>
            <div class="border-t border-slate-100 pt-4">
              <p class="text-xs text-slate-400">
                Admin staff? <a href="/admin.html" class="text-amber-600 hover:text-amber-700 font-medium">Admin Portal &rarr;</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation('signup');

      // If already logged in, redirect
      if (API.isUserLoggedIn()) {
        window.location.href = '/user-dashboard.html';
        return;
      }

      const form = document.getElementById('signup-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        await handleSignup();
      });

      // Password strength checker
      const passwordField = document.getElementById('password');
      passwordField.addEventListener('input', () => {
        checkPasswordStrength(passwordField.value);
        checkPasswordMatch();
      });
      document.getElementById('confirm-password').addEventListener('input', checkPasswordMatch);
    });

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function checkPasswordStrength(pwd) {
      const strengthDiv = document.getElementById('password-strength');
      const label = document.getElementById('strength-label');
      if (!pwd) { strengthDiv.classList.add('hidden'); return; }
      strengthDiv.classList.remove('hidden');

      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd) || /[^A-Za-z0-9]/.test(pwd)) score++;

      const colors = ['bg-rose-400', 'bg-amber-400', 'bg-yellow-400', 'bg-emerald-400'];
      const labels = ['Too short', 'Weak', 'Good', 'Strong'];
      for (let i = 1; i <= 4; i++) {
        const bar = document.getElementById(`str-${i}`);
        bar.className = `h-1 flex-1 rounded-full ${i <= score ? colors[score - 1] : 'bg-slate-200'}`;
      }
      label.textContent = labels[score - 1] || '';
      label.className = `text-xs ${score <= 1 ? 'text-rose-500' : score === 2 ? 'text-amber-500' : score === 3 ? 'text-yellow-600' : 'text-emerald-600'}`;
    }

    function checkPasswordMatch() {
      const pwd = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const matchLabel = document.getElementById('password-match');
      if (!confirm) { matchLabel.classList.add('hidden'); return; }
      matchLabel.classList.remove('hidden');
      if (pwd === confirm) {
        matchLabel.textContent = '✓ Passwords match';
        matchLabel.className = 'text-xs mt-1 text-emerald-600';
      } else {
        matchLabel.textContent = '✗ Passwords do not match';
        matchLabel.className = 'text-xs mt-1 text-rose-500';
      }
    }

    async function handleSignup() {
      const btn = document.getElementById('signup-btn');
      const errorDiv = document.getElementById('signup-error');
      const successDiv = document.getElementById('signup-success');
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Client-side validation
      if (!name) { errorDiv.textContent = 'Full name is required.'; errorDiv.classList.remove('hidden'); return; }
      if (!email) { errorDiv.textContent = 'Email address is required.'; errorDiv.classList.remove('hidden'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errorDiv.textContent = 'Please enter a valid email address.'; errorDiv.classList.remove('hidden'); return; }
      if (!password || password.length < 6) { errorDiv.textContent = 'Password must be at least 6 characters.'; errorDiv.classList.remove('hidden'); return; }
      if (password !== confirmPassword) { errorDiv.textContent = 'Passwords do not match. Please re-enter.'; errorDiv.classList.remove('hidden'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span>Creating account...</span>';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });
        
        let data;
        const text = await res.text();
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error(text ? `Server error (${res.status}): ${text.slice(0, 150)}` : `Server returned HTTP ${res.status}`);
        }

        if (!data.success) {
          throw new Error(data.message || 'Registration failed');
        }

        // Auto login after registration
        API.setUserToken(data.token);
        API.setCurrentUser(data.user);

        successDiv.textContent = `Account created successfully! Welcome, ${data.user.name}! Redirecting to your dashboard...`;
        successDiv.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = '/user-dashboard.html';
        }, 1500);
      } catch (err) {
        errorDiv.textContent = err.message || 'Registration failed. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>Create Account';
      }
    }
  </script>
</body>
</html>
